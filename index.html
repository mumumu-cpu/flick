<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f6fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flick" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Flick</title>
    <style>
      /* Critical CSS: shared by the pre-JS boot shell and the React app so the memo box is usable at first paint. */
      :root {
        --ink: #0d1017;
        --ink-2: rgba(13, 16, 23, 0.62);
        --ink-3: rgba(13, 16, 23, 0.38);
        --line: rgba(13, 16, 23, 0.07);
        --bg: #f5f6fa;
        --todo: #3b82f6;
        --doing: #f59e0b;
        --done: #10b981;
        --danger: #ef4444;
        --radius: 28px;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }
      .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; background: var(--bg); }
      .bg i {
        position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.75;
        animation: drift 22s ease-in-out infinite alternate; will-change: transform;
      }
      .bg i:nth-child(1) { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: #cfe6ff; }
      .bg i:nth-child(2) { width: 55vmax; height: 55vmax; right: -25vmax; top: 10vh; background: #ead9ff; animation-duration: 28s; animation-delay: -6s; }
      .bg i:nth-child(3) { width: 60vmax; height: 60vmax; left: -10vmax; bottom: -35vmax; background: #ffe3cf; animation-duration: 26s; animation-delay: -12s; }
      .bg i:nth-child(4) { width: 40vmax; height: 40vmax; right: -10vmax; bottom: -10vmax; background: #cff5e6; animation-duration: 32s; animation-delay: -3s; }
      @keyframes drift {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(6vmax, 4vmax, 0) scale(1.08); }
        100% { transform: translate3d(-4vmax, 8vmax, 0) scale(0.96); }
      }
      @media (prefers-reduced-motion: reduce) { .bg i { animation: none; } }

      .glass {
        position: relative;
        background: linear-gradient(140deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.42));
        -webkit-backdrop-filter: blur(24px) saturate(1.9);
        backdrop-filter: blur(24px) saturate(1.9);
        border-radius: var(--radius);
        box-shadow:
          0 12px 40px -14px rgba(28, 40, 90, 0.22),
          0 2px 6px -2px rgba(28, 40, 90, 0.06),
          inset 0 1px 1px rgba(255, 255, 255, 0.95),
          inset 0 -1px 1px rgba(255, 255, 255, 0.35);
      }
      .glass::before {
        content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
        background: linear-gradient(160deg, rgba(255,255,255,1), rgba(255,255,255,0.2) 35%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.85));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
      }
      .glass::after {
        /* specular sheen */
        content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,0.55), transparent 60%);
        mix-blend-mode: soft-light;
      }

      .shell {
        position: relative; z-index: 1; height: 100dvh; max-width: 560px; margin: 0 auto;
        display: flex; flex-direction: column;
        padding: calc(var(--safe-t) + 14px) 16px 0;
      }
      .composer { padding: 14px 14px 10px 18px; flex-shrink: 0; z-index: 2; }
      .composer textarea {
        display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent;
        font: inherit; font-size: 19px; line-height: 1.5; letter-spacing: 0.01em; color: var(--ink);
        min-height: 58px; max-height: 40vh; padding: 0; position: relative; z-index: 1;
      }
      .composer textarea::placeholder { color: var(--ink-3); }
      .composer-bar { display: flex; align-items: center; gap: 6px; height: 40px; margin-top: 4px; position: relative; z-index: 1; }

      #boot { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
      #boot .shell { pointer-events: auto; }
      #boot .topbar { height: 44px; margin-bottom: 12px; }
      #boot .sk { height: 84px; border-radius: 24px; margin-top: 10px; opacity: 0.6; }
      .sk-shimmer { background: linear-gradient(100deg, rgba(255,255,255,0.35) 20%, rgba(255,255,255,0.85) 40%, rgba(255,255,255,0.35) 60%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
      @keyframes shimmer { to { background-position: -150% 0; } }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="boot">
      <div class="shell">
        <div class="topbar"></div>
        <div class="glass composer">
          <textarea id="boot-memo" rows="2" placeholder="メモ" autofocus aria-label="メモ"></textarea>
          <div class="composer-bar"></div>
        </div>
        <div class="sk glass sk-shimmer" style="margin-top: 18px"></div>
        <div class="sk glass sk-shimmer"></div>
        <div class="sk glass sk-shimmer"></div>
      </div>
    </div>
    <script>
      // Restore a draft typed in a previous visit, before any JS bundle arrives.
      try { var d = localStorage.getItem('flick:draft'); if (d) document.getElementById('boot-memo').value = d; } catch (e) {}
      document.getElementById('boot-memo').focus();
    </script>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n" />
        <feGaussianBlur in="n" stdDeviation="2" result="nb" />
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="38" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
